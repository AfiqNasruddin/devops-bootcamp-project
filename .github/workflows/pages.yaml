name: GitHub Pages

#This workflow is to build and deploy your GitHub Pages site when you push to the main branch or when you manually trigger the workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - .github/workflows/pages.yml
  
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build site
        env:
          PAGES_CUSTOM_DOMAIN: ${{ secrets.PAGES_CUSTOM_DOMAIN }}
        run: |
          mkdir -p _site
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          pandoc README.md -s -f gfm -t html5 \
            --metadata title="DevOps Bootcamp Project" \
            -o _site/index.html
          mkdir -p _site/docs
          cp docs/*.md _site/docs/ 2>/dev/null || true
          if [ -n "${PAGES_CUSTOM_DOMAIN}" ]; then
            printf '%s\n' "${PAGES_CUSTOM_DOMAIN}" > _site/CNAME
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
