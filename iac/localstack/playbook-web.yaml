---
- name: Webserver setup
  hosts: web
  become: true
  gather_facts: true
  vars:
    aws_region: ap-southeast-1
    ecr_repo: devops-bootcamp/final-project-afiq
    image_tag: latest
    app_name: ship
    app_host_port: 80
    app_container_port: 8080
  tasks:
    - name: Update apt cache and upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - git
          - curl
          - python3
          - python3-pip
          - python3-venv
          - unzip
          - software-properties-common
          - zsh
        state: present

    - name: Set ubuntu login shell to zsh
      ansible.builtin.user:
        name: ubuntu
        shell: /usr/bin/zsh

    - name: Clone Oh My Zsh
      ansible.builtin.git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: /home/ubuntu/.oh-my-zsh
        version: master
      become_user: ubuntu

    - name: Install Oh My Zsh default zshrc
      ansible.builtin.copy:
        src: /home/ubuntu/.oh-my-zsh/templates/zshrc.zsh-template
        dest: /home/ubuntu/.zshrc
        remote_src: true
        force: false
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Install Docker
      ansible.builtin.include_role:
        name: geerlingguy.docker
      vars:
        docker_users:
          - ubuntu

    - name: Wait for Docker socket
      ansible.builtin.wait_for:
        path: /var/run/docker.sock
        timeout: 90

    - name: Install AWS CLI v2
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
        unzip -q -o /tmp/awscliv2.zip -d /tmp
        /tmp/aws/install
      args:
        creates: /usr/local/bin/aws

    - name: Read AWS account ID
      ansible.builtin.command: aws sts get-caller-identity --query Account --output text
      register: aws_account
      changed_when: false

    - name: Set ECR image name
      ansible.builtin.set_fact:
        ecr_image: "{{ aws_account.stdout }}.dkr.ecr.{{ aws_region }}.amazonaws.com/{{ ecr_repo }}:{{ image_tag }}"

    - name: Get ECR login password
      ansible.builtin.command: aws ecr get-login-password --region {{ aws_region }}
      register: ecr_password
      changed_when: false
      no_log: true

    - name: Log in to ECR
      community.docker.docker_login:
        registry_url: "{{ aws_account.stdout }}.dkr.ecr.{{ aws_region }}.amazonaws.com"
        username: AWS
        password: "{{ ecr_password.stdout }}"
      no_log: true

    - name: Pull application image
      community.docker.docker_image:
        name: "{{ ecr_image }}"
        source: pull

    - name: Run application container
      community.docker.docker_container:
        name: "{{ app_name }}"
        image: "{{ ecr_image }}"
        restart_policy: unless-stopped
        published_ports:
          - "{{ app_host_port }}:{{ app_container_port }}"
        state: started

    - name: Clone Infratify/ship
      ansible.builtin.git:
        repo: https://github.com/Infratify/ship.git
        dest: /home/ubuntu/infratify-ship
      become_user: ubuntu

    - name: Install node_exporter
      ansible.builtin.include_role:
        name: prometheus.prometheus.node_exporter
      vars:
        node_exporter_web_listen_address: "0.0.0.0:9100"

    - name: Check application HTTP
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_host_port }}/"
        status_code: [200, 301, 302]
      register: app_http
      retries: 10
      delay: 3
      until: app_http.status in [200, 301, 302]

    - name: Check node_exporter metrics
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        status_code: 200
      retries: 5
      delay: 2
